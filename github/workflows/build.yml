name: SmartHandController ESP32 Auto Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY_OLED: SSD1306
  DISPLAY_LANGUAGE: L_en
  SERIAL_RADIO: WIFI_STATION
  SERIAL_ONSTEP: OFF
  ESP32_CORE: 2.0.17

jobs:
  build:
    name: Build SmartHandController Firmware
    runs-on: ubuntu-latest

    steps:

      # 1. Download your repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Check source files
      - name: Check SmartHandController Source
        run: |
          echo "Checking repository..."

          ls -la

          test -f SmartHandController.ino
          test -f Config.h
          test -f Extended.config.h
          test -f Catalogs.config.h
          test -f src/Common.h

          echo "Source files found successfully."

      # 3. Configure display and connection
      - name: Configure SmartHandController
        shell: bash
        run: |
          setdef() {
            KEY="$1"
            VALUE="$2"

            if ! grep -qE "^#define[[:space:]]+$KEY[[:space:]]" Config.h; then
              echo "::error::$KEY not found in Config.h"
              exit 1
            fi

            sed -i -E \
              "s|^(#define[[:space:]]+$KEY[[:space:]]+)[^[:space:]/]+|\\1$VALUE|" \
              Config.h
          }

          setdef DISPLAY_OLED "$DISPLAY_OLED"
          setdef DISPLAY_LANGUAGE "$DISPLAY_LANGUAGE"
          setdef SERIAL_RADIO "$SERIAL_RADIO"
          setdef SERIAL_ONSTEP "$SERIAL_ONSTEP"

          echo "Configuration completed."

          grep -E "^#define[[:space:]]+(DISPLAY_OLED|DISPLAY_LANGUAGE|SERIAL_RADIO|SERIAL_ONSTEP)[[:space:]]" Config.h

      # 4. Install Arduino CLI
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # 5. Install ESP32 Core
      - name: Install ESP32 Core
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

          arduino-cli core install esp32:esp32@${ESP32_CORE}

      # 6. Install U8g2
      - name: Install U8g2 Library
        run: |
          arduino-cli lib update-index
          arduino-cli lib install U8g2

      # 7. Install Ephemeris directly from GitHub
      - name: Install Ephemeris Library
        run: |
          mkdir -p "$HOME/Arduino/libraries"

          git clone --depth 1 \
            https://github.com/MarScaper/ephemeris.git \
            "$HOME/Arduino/libraries/Ephemeris"

          echo "Checking Ephemeris library..."

          test -f "$HOME/Arduino/libraries/Ephemeris/Ephemeris.h"

          ls -la "$HOME/Arduino/libraries/Ephemeris"

          echo "Ephemeris installed successfully."

      # 8. Prepare Arduino Sketch
      - name: Prepare SmartHandController
        run: |
          mkdir -p build/SmartHandController

          cp SmartHandController.ino build/SmartHandController/
          cp Config.h build/SmartHandController/
          cp Extended.config.h build/SmartHandController/
          cp Catalogs.config.h build/SmartHandController/

          cp -a src build/SmartHandController/

          echo "Sketch prepared."

          ls -la build/SmartHandController

      # 9. Verify libraries
      - name: Verify Dependencies
        run: |
          echo "Checking installed libraries..."

          find "$HOME/Arduino/libraries" \
            -name "Ephemeris.h" -o -name "U8g2lib.h"

          test -f "$HOME/Arduino/libraries/Ephemeris/Ephemeris.h"

      # 10. Compile ESP32 firmware
      - name: Compile ESP32 Firmware
        run: |
          mkdir -p output

          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --warnings all \
            --export-binaries \
            --output-dir output \
            build/SmartHandController

      # 11. Check BIN files
      - name: Verify Firmware
        if: success()
        run: |
          echo "Searching firmware BIN files..."

          find output -type f -name "*.bin" -ls

          if ! find output -type f -name "*.bin" | grep -q .; then
            echo "::error::No firmware BIN files generated"
            exit 1
          fi

          echo "Firmware generated successfully."

      # 12. Save build information
      - name: Save Build Information
        if: success()
        run: |
          {
            echo "SmartHandController ESP32"
            echo "ESP32 Core: $ESP32_CORE"
            echo "OLED: $DISPLAY_OLED"
            echo "Language: $DISPLAY_LANGUAGE"
            echo "Radio: $SERIAL_RADIO"
            echo "OnStep: $SERIAL_ONSTEP"
          } > output/build-info.txt

      # 13. Upload firmware
      - name: Upload ESP32 Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartHandController-ESP32-Firmware
          path: output/
          if-no-files-found: error
          retention-days: 14
