name: SmartHandController ESP32 Build

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY_OLED: SSD1306
  DISPLAY_LANGUAGE: L_en
  SERIAL_RADIO: WIFI_STATION
  SERIAL_ONSTEP: OFF
  ESP32_CORE: 2.0.17

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Repository Files
        run: |
          echo "Repository files:"
          ls -la
          find . -maxdepth 3 -name "*.ino"

      - name: Find SmartHandController
        shell: bash
        run: |
          SKETCH=$(find . -maxdepth 4 -name "*.ino" | head -n 1)

          if [ -z "$SKETCH" ]; then
            echo "::error::No Arduino INO file found"
            exit 1
          fi

          DIR=$(dirname "$SKETCH")

          echo "SKETCH_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Found: $SKETCH"

          if [ ! -f "$DIR/Config.h" ]; then
            echo "::error::Config.h not found"
            exit 1
          fi

      - name: Configure SmartHandController
        shell: bash
        run: |
          cd "$SKETCH_DIR"

          setdef() {
            KEY="$1"
            VALUE="$2"

            grep -qE "^#define[[:space:]]+$KEY[[:space:]]" Config.h || {
              echo "::error::$KEY not found"
              exit 1
            }

            sed -i -E \
              "s|^(#define[[:space:]]+$KEY[[:space:]]+)[^[:space:]/]+|\\1$VALUE|" \
              Config.h
          }

          setdef DISPLAY_OLED "$DISPLAY_OLED"
          setdef DISPLAY_LANGUAGE "$DISPLAY_LANGUAGE"
          setdef SERIAL_RADIO "$SERIAL_RADIO"
          setdef SERIAL_ONSTEP "$SERIAL_ONSTEP"

          echo "Configuration complete"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Install Libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install U8g2

      - name: Compile Firmware
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --export-binaries \
            --output-dir "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/$SKETCH_DIR"

      - name: Collect Firmware Files
        if: success()
        run: |
          find "$GITHUB_WORKSPACE" \
            -path "$GITHUB_WORKSPACE/out" -prune -o \
            -name "*.bin" -type f -print \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \;

          echo "Build completed"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload Firmware BIN
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartHandController-ESP32-Firmware
          path: out/*.bin
          if-no-files-found: error
          retention-days: 14
