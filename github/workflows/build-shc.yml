name: Build SmartHandController ESP32

on:
  push:
  workflow_dispatch:

env:
  DISPLAY_OLED: SSD1306
  DISPLAY_LANGUAGE: L_en
  SERIAL_RADIO: WIFI_STATION
  SERIAL_ONSTEP: OFF
  ESP32_CORE: 2.0.17

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download your repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Find SmartHandController source
      - name: Locate Source
        shell: bash
        run: |
          if [ -f "SmartHandController/SmartHandController.ino" ]; then
            echo "SKETCH_DIR=SmartHandController" >> $GITHUB_ENV
          elif [ -f "SmartHandController.ino" ]; then
            echo "SKETCH_DIR=." >> $GITHUB_ENV
          else
            echo "::error::SmartHandController.ino not found"
            find . -maxdepth 3 -name "*.ino"
            exit 1
          fi

      # 3. Configure firmware
      - name: Configure Firmware
        shell: bash
        run: |
          cd "$SKETCH_DIR"

          for item in \
            "DISPLAY_OLED:$DISPLAY_OLED" \
            "DISPLAY_LANGUAGE:$DISPLAY_LANGUAGE" \
            "SERIAL_RADIO:$SERIAL_RADIO" \
            "SERIAL_ONSTEP:$SERIAL_ONSTEP"
          do
            KEY="${item%%:*}"
            VALUE="${item#*:}"

            if ! grep -qE "^#define[[:space:]]+$KEY[[:space:]]" Config.h; then
              echo "::error::$KEY not found in Config.h"
              exit 1
            fi

            sed -i -E \
              "s|^(#define[[:space:]]+$KEY[[:space:]]+)[^[:space:]/]+|\\1$VALUE|" \
              Config.h
          done

          cat Config.h

      # 4. Install Arduino CLI
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # 5. Install ESP32 board
      - name: Install ESP32 Core
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

          arduino-cli core install esp32:esp32@${ESP32_CORE}

      # 6. Install required libraries
      - name: Install Libraries
        run: |
          arduino-cli lib update-index

          arduino-cli lib install U8g2

          arduino-cli lib install Ephemeris

      # 7. Compile firmware
      - name: Compile ESP32 Firmware
        run: |
          mkdir -p out

          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --warnings all \
            --export-binaries \
            --output-dir "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/$SKETCH_DIR"

      # 8. Save settings and pin information
      - name: Save Build Information
        if: success()
        run: |
          echo "ESP32 SmartHandController Build" > out/build-info.txt
          echo "Core: $ESP32_CORE" >> out/build-info.txt
          echo "Display: $DISPLAY_OLED" >> out/build-info.txt
          echo "Language: $DISPLAY_LANGUAGE" >> out/build-info.txt
          echo "Radio: $SERIAL_RADIO" >> out/build-info.txt
          echo "OnStep: $SERIAL_ONSTEP" >> out/build-info.txt

          find . -maxdepth 3 -name "*.bin" -exec cp {} out/ \;

          ls -lh out

      # 9. Upload firmware
      - name: Upload ESP32 Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartHandController-ESP32-Firmware
          path: out/
          if-no-files-found: error
          retention-days: 14
