name: SmartHandController ESP32 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE: 2.0.17

jobs:
  build:
    name: Build Smart Hand Controller
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Source Files
        run: |
          echo "Checking SHC source..."

          test -f SmartHandController.ino
          test -f Config.h
          test -f Extended.config.h
          test -f src/Common.h

          echo "All main source files found."

      - name: Configure OLED and WiFi
        shell: bash
        run: |
          setdef() {
            KEY="$1"
            VALUE="$2"

            grep -qE "^#define[[:space:]]+$KEY[[:space:]]" "$3"

            sed -i -E \
              "s|^(#define[[:space:]]+$KEY[[:space:]]+)[^[:space:]/]+|\\1$VALUE|" \
              "$3"
          }

          setdef DISPLAY_LANGUAGE L_en Config.h
          setdef DISPLAY_OLED SSD1306 Config.h
          setdef SERIAL_ONSTEP SERIAL_IP Config.h
          setdef SERIAL_IP_MODE STATION Extended.config.h

          echo "Configuration completed."

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Install Libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install U8g2

      - name: Prepare Arduino Sketch
        run: |
          mkdir -p build/SmartHandController

          cp -a Config.h Extended.config.h \
            Catalogs.config.h SmartHandController.ino \
            src build/SmartHandController/

          echo "Arduino sketch prepared."

      - name: Compile ESP32 Firmware
        run: |
          mkdir -p output

          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --warnings all \
            --export-binaries \
            --output-dir output \
            build/SmartHandController

      - name: Check Firmware
        if: success()
        run: |
          echo "Firmware files:"

          find output -type f -name "*.bin" -ls

          test -n "$(find output -type f -name "*.bin")"

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHC-ESP32-Firmware
          path: output/*.bin
          if-no-files-found: error
          retention-days: 14
